<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — 这首歌弄丢了</title>
  <meta name="description" content="404 — 你找的页面不在这个次元">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" href="/favicon/favicon_256x256.png" sizes="256x256">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: 'ZCOOL KuaiLe', 'Ropa Sans', sans-serif;
      background: linear-gradient(180deg, #070c26 0%, #101a4a 35%, #3d2b70 70%, #7a4a94 100%);
      color: #2a1030;
      overflow-x: hidden;
    }

    .star {
      position: fixed;
      background: #fff;
      border-radius: 50%;
      z-index: 0;
      animation: twinkle ease-in-out infinite;
    }
    @keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }

    /* ===== Y2K 随身听 ===== */
    .player {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      background: linear-gradient(165deg, #ffd6e8 0%, #ffb0d2 45%, #e79ae0 100%);
      border: 3px solid #3b1a4a;
      border-radius: 30px;
      padding: 18px 20px 22px;
      box-shadow: 8px 8px 0 rgba(59, 26, 74, .55), 0 0 60px rgba(255, 176, 210, .25);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Pixelify Sans', monospace;
      font-size: .72rem;
      letter-spacing: .08em;
      color: #5a2a63;
      margin-bottom: 12px;
    }

    /* 屏幕 */
    .screen {
      background: #1b1240;
      border: 3px solid #3b1a4a;
      border-radius: 16px;
      padding: 16px 14px 14px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .screen-tag {
      font-family: 'Pixelify Sans', monospace;
      font-size: .68rem;
      letter-spacing: .22em;
      color: #ffb0d2;
      margin-bottom: 6px;
    }

    .bignum {
      font-family: 'Pixelify Sans', monospace;
      font-weight: 700;
      font-size: 3.6rem;
      line-height: 1;
      color: #fff3fa;
      text-shadow: 3px 3px 0 #ff5fa2, 6px 6px 0 rgba(184, 151, 242, .7);
    }

    .screen-msg {
      font-size: .95rem;
      color: #ffe9f5;
      margin-top: 10px;
      line-height: 1.5;
      min-height: 2.9em;
    }

    .track {
      font-family: 'Pixelify Sans', monospace;
      font-size: .72rem;
      color: #b897f2;
      margin-top: 8px;
      letter-spacing: .06em;
    }

    /* 唱片 */
    .disc-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 16px 0 10px;
    }

    .disc {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, #2a1440 0 3px, #3d1f5c 3px 6px);
      border: 3px solid #3b1a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, .35);
      animation: spin 4s linear infinite paused;
    }

    .disc.playing { animation-play-state: running; animation-duration: 1.1s; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .disc span {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ffd6e8;
      border: 2px solid #3b1a4a;
      font-family: 'Pixelify Sans', monospace;
      font-size: .6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5a2a63;
    }

    .disc-hint {
      font-size: .72rem;
      color: #6b2f74;
      line-height: 1.5;
      max-width: 120px;
    }

    /* 进度条 */
    .progress {
      height: 12px;
      background: rgba(59, 26, 74, .25);
      border: 2px solid #3b1a4a;
      border-radius: 8px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0;
      background: repeating-linear-gradient(90deg, #ff5fa2 0 8px, #b897f2 8px 16px);
      transition: width .25s linear;
    }

    .progress-cap {
      font-family: 'Pixelify Sans', monospace;
      font-size: .66rem;
      color: #5a2a63;
      text-align: center;
      margin-top: 6px;
      letter-spacing: .1em;
      min-height: 1.2em;
    }

    /* 按钮 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 16px 0 14px;
    }

    .controls button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid #3b1a4a;
      background: #fff3fa;
      color: #3b1a4a;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(59, 26, 74, .5);
      transition: transform .12s, box-shadow .12s, background .2s;
    }

    .controls button:hover { background: #ffe3f1; }
    .controls button:active { transform: translate(3px, 3px); box-shadow: none; }

    /* 搜索框（保留原来的梗，但不再跳到不存在的页面） */
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 3px solid #3b1a4a;
      border-radius: 12px;
      background: #fff3fa;
      font-family: inherit;
      font-size: .85rem;
      color: #3b1a4a;
    }

    .search-row input::placeholder { color: #a86ba8; }

    .search-row button {
      padding: 10px 14px;
      border: 3px solid #3b1a4a;
      border-radius: 12px;
      background: #b897f2;
      color: #2a1030;
      font-family: 'Pixelify Sans', monospace;
      font-size: .8rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(59, 26, 74, .5);
    }

    .search-row button:active { transform: translate(3px, 3px); box-shadow: none; }

    .shake { animation: shake .4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* 链接 */
    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: .85rem;
    }

    .links a {
      text-decoration: none;
      color: #3b1a4a;
      background: #fff3fa;
      border: 3px solid #3b1a4a;
      border-radius: 999px;
      padding: 8px 16px;
      box-shadow: 3px 3px 0 rgba(59, 26, 74, .5);
      transition: background .2s;
    }

    .links a:hover { background: #ffd6e8; }

    /* 隐藏曲目彩蛋 */
    .burst {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      opacity: 0;
    }

    .burst.show { animation: pop 1.4s ease-out; }
    @keyframes pop {
      0% { opacity: 0; transform: scale(.4); }
      30% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0; transform: scale(1.6); }
    }

    @media (max-width: 420px) {
      .bignum { font-size: 3rem; }
      .disc { width: 72px; height: 72px; }
    }
  </style>
</head>

<body>
  <div class="burst" id="burst" aria-hidden="true">✦♡✦</div>

  <main class="player">
    <div class="top-row">
      <span>KUMORIRI ✦ MP-404</span>
      <span>▮▮▮▯</span>
    </div>

    <div class="screen">
      <p class="screen-tag">TRACK NOT FOUND</p>
      <p class="bignum">404</p>
      <p class="screen-msg" id="msg">这首歌弄丢了……<br>你找的页面不在这个次元</p>
      <p class="track" id="track">♪ ？？？ — 迷路的云</p>
    </div>

    <div class="disc-wrap">
      <div class="disc" id="disc" role="button" tabindex="0" aria-label="点我五下有惊喜">
        <span>404</span>
      </div>
      <p class="disc-hint">（偷偷告诉你：连点我 5 下有隐藏曲目）</p>
    </div>

    <div class="progress"><div class="bar" id="bar"></div></div>
    <p class="progress-cap" id="cap">LOADING… 0%</p>

    <div class="controls">
      <button id="prev" aria-label="上一首">⏮</button>
      <button id="play" aria-label="播放/暂停">⏯</button>
      <button id="next" aria-label="下一首">⏭</button>
    </div>

    <div class="search-row" id="searchRow">
      <input id="q" type="text" placeholder="请找到黄春…!" aria-label="搜索">
      <button id="go">SEARCH</button>
    </div>

    <nav class="links">
      <a href="/">← 回到首页</a>
      <a href="/gallery.html">去 Gallery ♡</a>
    </nav>
  </main>

  <script>
    // ===== 背景星星 =====
    (function () {
      var n = window.innerWidth < 600 ? 40 : 80;
      for (var i = 0; i < n; i++) {
        var s = document.createElement('span');
        s.className = 'star';
        var size = (Math.random() * 2.2 + 0.8).toFixed(1);
        s.style.cssText =
          'left:' + (Math.random() * 100).toFixed(2) + '%;' +
          'top:' + (Math.random() * 100).toFixed(2) + '%;' +
          'width:' + size + 'px;height:' + size + 'px;' +
          'animation-duration:' + (2 + Math.random() * 4.5).toFixed(2) + 's;' +
          'animation-delay:' + (Math.random() * 5).toFixed(2) + 's;';
        document.body.appendChild(s);
      }
    })();

    var msg = document.getElementById('msg');
    var track = document.getElementById('track');
    var cap = document.getElementById('cap');
    var bar = document.getElementById('bar');
    var disc = document.getElementById('disc');
    var playBtn = document.getElementById('play');

    // ===== 假曲目：按下一首会循环这些吐槽 =====
    var tracks = [
      ['♪ ？？？ — 迷路的云', '这首歌弄丢了……<br>你找的页面不在这个次元'],
      ['♪ 第 404 首 — 404', '还是第 404 首'],
      ['♪ 404 (Not Found) — 未知歌手', '真的只有这一首了'],
      ['♪ 404 (Not Found) — 未知歌手', '别按了，它真的不存在 (｡•́︿•̀｡)']
    ];
    var idx = 0;

    function render() {
      track.textContent = tracks[idx][0];
      msg.innerHTML = tracks[idx][1];
    }

    document.getElementById('next').onclick = function () {
      idx = (idx + 1) % tracks.length;
      render();
    };

    document.getElementById('prev').onclick = function () {
      idx = (idx - 1 + tracks.length) % tracks.length;
      render();
    };

    var playing = false;
    playBtn.onclick = function () {
      playing = !playing;
      disc.classList.toggle('playing', playing);
      if (playing) {
        msg.innerHTML = '正在播放：404 (Not Found)<br>不过它不会真的响 ♪';
      } else {
        render();
      }
    };

    // ===== 进度条：永远加载不完 =====
    var p = 0;
    setInterval(function () {
      p += Math.random() * 6 + 2;
      if (p >= 99) {
        p = 0;
        cap.textContent = '差点就好了…又断线了';
      } else {
        cap.textContent = 'LOADING… ' + Math.round(p) + '%';
      }
      bar.style.width = p + '%';
    }, 380);

    // ===== 搜索：保留原来的梗 =====
    function doSearch() {
      var v = document.getElementById('q').value.trim();
      var row = document.getElementById('searchRow');
      row.classList.remove('shake');
      void row.offsetWidth;
      row.classList.add('shake');

      if (!v) {
        msg.innerHTML = '总得写点什么吧…';
      } else if (v.indexOf('黄春') > -1) {
        msg.innerHTML = '咦？搜到点线索……<br>（但还是没有）';
      } else {
        msg.innerHTML = '搜索失败：黄春出门看海了 ✧';
      }
    }

    document.getElementById('go').onclick = doSearch;
    document.getElementById('q').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doSearch();
    });

    // ===== 彩蛋：点唱片 5 下为隐藏曲目 =====
    var clicks = 0;
    disc.onclick = function () {
      clicks++;
      if (clicks === 5) {
        clicks = 0;
        document.getElementById('burst').classList.remove('show');
        void document.getElementById('burst').offsetWidth;
        document.getElementById('burst').classList.add('show');
        msg.innerHTML = '✦ 隐藏曲目解锁 ✦<br>《终わりはいつも早すぎる》';
        track.textContent = '♪ 千年幸福論 — amazarashi';
        disc.classList.add('playing');
        playing = true;
      }
    };
  </script>
</body>
</html>
